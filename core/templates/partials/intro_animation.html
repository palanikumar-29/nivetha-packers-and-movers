<div id="intro-overlay" class="intro-overlay" aria-hidden="true">
<button type="button" id="intro-skip" class="intro-skip" aria-label="Skip intro animation">Skip</button>
<div class="intro-stage">
<svg class="intro-road" viewBox="0 0 100 4" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="2" x2="100" y2="2" stroke="var(--intro-road-base)" stroke-width="3"/><line x1="0" y1="2" x2="100" y2="2" stroke="var(--intro-road-dashes)" stroke-opacity=".6" stroke-dasharray="3 3"/></svg>
<svg class="intro-truck" viewBox="0 0 100 50" aria-hidden="true"><rect x="5" y="8" width="55" height="30" rx="2" fill="var(--intro-truck-cargo)" stroke="var(--intro-truck-stroke)"/><rect x="5" y="22" width="55" height="4" fill="var(--intro-truck-accent)"/><path d="M60 18h18l10 10v10H60z" fill="var(--intro-truck-accent)"/><path d="M62 21h14l8 7H62z" fill="var(--intro-truck-window)"/><circle cx="22" cy="38" r="8" fill="var(--intro-truck-wheel-fill)" stroke="var(--intro-truck-stroke)" stroke-width="2"/><circle cx="22" cy="38" r="3" fill="var(--intro-truck-accent)"/><circle cx="75" cy="38" r="8" fill="var(--intro-truck-wheel-fill)" stroke="var(--intro-truck-stroke)" stroke-width="2"/><circle cx="75" cy="38" r="3" fill="var(--intro-truck-accent)"/></svg>
<svg class="intro-parcel" viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="15" width="30" height="22" rx="1" fill="var(--intro-parcel-body)" stroke="var(--intro-truck-stroke)"/><rect class="parcel-tape" x="18" y="10" width="4" height="27" fill="var(--color-route-green)" rx="1"/><polygon class="parcel-flap-left" points="5,15 20,15 18,10 7,10" fill="var(--intro-parcel-flap)" stroke="var(--intro-truck-stroke)"/><polygon class="parcel-flap-right" points="20,15 35,15 33,10 22,10" fill="var(--intro-parcel-flap)" stroke="var(--intro-truck-stroke)"/></svg>
</div>
</div>
<script>
(function(){
var o=document.getElementById('intro-overlay');if(!o)return;
function d(){if(!o||o.dataset.off)return;o.dataset.off='1';try{sessionStorage.setItem('intro_seen','1')}catch(e){}o.remove();document.documentElement.classList.remove('intro-play','intro-low')}
var s=document.getElementById('intro-skip');if(s)s.addEventListener('click',d);
o.addEventListener('animationend',function(e){if(e.target===o)d()});
var l=document.documentElement.classList.contains('intro-low');setTimeout(d,l?900:3800);
})();
</script>
